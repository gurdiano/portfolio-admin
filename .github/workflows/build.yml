name: Build and Push Portfolio Admin

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/gurdiano/portfolio_admin_prod:latest

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create environment file
        run: |
          mkdir -p src/environments
          cat <<EOF > src/environments/environment.ts
          ${{ secrets.ENV_PROD_FILE }}
          EOF

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .

      - name: Push Docker image
        run: docker push $IMAGE_NAME

      - name: Trigger Portainer Webhook
        run: |
         curl -X POST \
            -H "CF-Access-Client-Id: ${{ secrets.CF_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_CLIENT_SECRET }}" \
            ${{ secrets.PORTAINER_WEBHOOK_URL }}