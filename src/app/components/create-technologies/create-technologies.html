<app-base-card name="make a new technology" icon="assets\images\svgs\plus-solid-full-purple.svg" id="destino-scroll">
    <form class="technology-form" [formGroup]="techForm" (ngSubmit)="onSubmit()">
        <!-- input -->
        <h2 class="h2-label">Technology Name</h2>
        <mat-form-field appearance="fill">
            <mat-label>Name</mat-label>
            <input matInput placeholder="Ex: Angular, Docker..." name="techName" formControlName="name">
        </mat-form-field>

        <!-- source -->
         <div formGroupName="sourceForm" class="technology-form">
            <!-- toggle -->
            <h2 class="h2-label">Icon Source</h2>
            <mat-button-toggle-group #sourceGroup="matButtonToggleGroup" value="upload" name="fontStyle" aria-label="Font Style" formControlName="toggle">
                <mat-button-toggle value="gallery">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free 7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M352 173.3L352 384C352 401.7 337.7 416 320 416C302.3 416 288 401.7 288 384L288 173.3L246.6 214.7C234.1 227.2 213.8 227.2 201.3 214.7C188.8 202.2 188.8 181.9 201.3 169.4L297.3 73.4C309.8 60.9 330.1 60.9 342.6 73.4L438.6 169.4C451.1 181.9 451.1 202.2 438.6 214.7C426.1 227.2 405.8 227.2 393.3 214.7L352 173.3zM320 464C364.2 464 400 428.2 400 384L480 384C515.3 384 544 412.7 544 448L544 480C544 515.3 515.3 544 480 544L160 544C124.7 544 96 515.3 96 480L96 448C96 412.7 124.7 384 160 384L240 384C240 428.2 275.8 464 320 464zM464 488C477.3 488 488 477.3 488 464C488 450.7 477.3 440 464 440C450.7 440 440 450.7 440 464C440 477.3 450.7 488 464 488z"/></svg>
                    <span>GALLERY</span>
                </mat-button-toggle>
                <mat-button-toggle value="upload">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free 7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M352 528L128 528C119.2 528 112 520.8 112 512L112 288C112 279.2 119.2 272 128 272L176 272L176 224L128 224C92.7 224 64 252.7 64 288L64 512C64 547.3 92.7 576 128 576L352 576C387.3 576 416 547.3 416 512L416 464L368 464L368 512C368 520.8 360.8 528 352 528zM288 368C279.2 368 272 360.8 272 352L272 128C272 119.2 279.2 112 288 112L512 112C520.8 112 528 119.2 528 128L528 352C528 360.8 520.8 368 512 368L288 368zM224 352C224 387.3 252.7 416 288 416L512 416C547.3 416 576 387.3 576 352L576 128C576 92.7 547.3 64 512 64L288 64C252.7 64 224 92.7 224 128L224 352z"/></svg>
                    <span>UPLOAD NOW</span>
                </mat-button-toggle>
            </mat-button-toggle-group>

             @if (sourceGroup.value === 'gallery') {
                 <h2 class="h2-label">Select Icon</h2>
                 <app-filter-input 
                    [options]="options()"
                    (onSelected)="handleSelection($event)"
                    >
                 </app-filter-input>
             }
             
             @if (sourceGroup.value === 'upload') {
                 <h2 class="h2-label">Upload Image</h2>
                 <div 
                     class="drop-zone"
                     [class.drop-zone-active]="isDragging"
                     (dragover)="onDragOver($event)"
                     (dragleave)="onDragLeave()"
                     (drop)="onDrop($event)"
                     (click)="fileInput.click()">
                     
                     <input type="file" #fileInput style="display: none" (change)="onFileSelected($event)" accept="image/*">
     
                     <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free 7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M160 96C124.7 96 96 124.7 96 160L96 480C96 515.3 124.7 544 160 544L480 544C515.3 544 544 515.3 544 480L544 160C544 124.7 515.3 96 480 96L160 96zM224 176C250.5 176 272 197.5 272 224C272 250.5 250.5 272 224 272C197.5 272 176 250.5 176 224C176 197.5 197.5 176 224 176zM368 288C376.4 288 384.1 292.4 388.5 299.5L476.5 443.5C481 450.9 481.2 460.2 477 467.8C472.8 475.4 464.7 480 456 480L184 480C175.1 480 166.8 475 162.7 467.1C158.6 459.2 159.2 449.6 164.3 442.3L220.3 362.3C224.8 355.9 232.1 352.1 240 352.1C247.9 352.1 255.2 355.9 259.7 362.3L286.1 400.1L347.5 299.6C351.9 292.5 359.6 288.1 368 288.1z"/></svg>
             
                     @if (selectedFileName) {
                         <p class="file-info">Selected: <strong>{{ selectedFileName }}</strong></p>
                     } @else {
                         <p>FILE.PNG</p>
                     }
                 </div>
             }
            </div>
        
        <!-- submit -->
        <div class="button-row">
            <button matButton="filled" type="submit" [disabled]="techForm.invalid">Create</button>
        </div>
    </form>
    
    <app-response-msg [success]="success" [error]="error"></app-response-msg>
</app-base-card>
